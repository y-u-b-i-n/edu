<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>테스트중입니다 | HDP 아카데미</title>


  <!-- Noto Sans KR -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f7f8fa;
      color: #191919;
    }


    /* =========================
       상단
    ========================= */

    header {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e8e8e8;
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .hub-link {
      color: #555555;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .hub-link:hover {
      color: #000000;
    }


    /* =========================
       본문
    ========================= */

    main {
      width: 100%;
      max-width: 760px;
      margin: 40px auto 60px;
      padding: 0 20px;
    }


    /* =========================
       제목
    ========================= */

    .title-area {
      text-align: center;
      margin-bottom: 22px;
    }

    .category {
      margin-bottom: 7px;
      color: #888888;
      font-size: 13px;
      font-weight: 500;
    }

    .title-area h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }


    /* =========================
       캐러셀
    ========================= */

    .carousel {
      position: relative;
      width: 100%;

      overflow: hidden;

      background: #ffffff;
      border-radius: 18px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);
    }

    .slides {
      display: flex;
      width: 100%;

      transition:
        transform 0.35s ease;

      touch-action: pan-y;
    }

    .slide {
      min-width: 100%;
      width: 100%;
    }

    .slide img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =========================
       좌우 버튼
    ========================= */

    .arrow {
      position: absolute;
      top: 50%;

      transform:
        translateY(-50%);

      width: 46px;
      height: 46px;

      border: 0;
      border-radius: 50%;

      background:
        rgba(0, 0, 0, 0.45);

      color: #ffffff;

      font-family:
        "Noto Sans KR",
        sans-serif;

      font-size: 28px;

      cursor: pointer;

      z-index: 10;

      transition:
        background 0.2s ease;
    }

    .arrow:hover {
      background:
        rgba(0, 0, 0, 0.65);
    }

    .prev {
      left: 12px;
    }

    .next {
      right: 12px;
    }


    /* =========================
       페이지 표시
    ========================= */

    .navigation {
      text-align: center;
      padding-top: 18px;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #cccccc;

      cursor: pointer;

      transition:
        all 0.2s ease;
    }

    .dot.active {
      width: 22px;

      border-radius: 10px;

      background: #222222;
    }

    .counter {
      margin-top: 9px;

      color: #888888;

      font-size: 13px;
    }


    /* =========================
       돌아가기
    ========================= */

    .back-area {
      margin-top: 28px;
      text-align: center;
    }

    .back-button {
      display: inline-block;

      padding: 11px 18px;

      border:
        1px solid #dddddd;

      border-radius: 9px;

      background: #ffffff;

      color: #333333;

      text-decoration: none;

      font-size: 14px;
      font-weight: 600;

      transition:
        background 0.2s ease;
    }

    .back-button:hover {
      background: #f1f1f1;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 600px) {

      .header-inner {
        padding: 16px 18px;
      }

      .logo {
        font-size: 17px;
      }

      main {
        margin: 26px auto 45px;
        padding: 0;
      }

      .title-area {
        padding: 0 18px;
        margin-bottom: 18px;
      }

      .title-area h1 {
        font-size: 22px;
      }

      .carousel {
        border-radius: 0;
        box-shadow: none;
      }

      .arrow {
        width: 40px;
        height: 40px;
        font-size: 24px;
      }

      .prev {
        left: 8px;
      }

      .next {
        right: 8px;
      }

      .back-area {
        padding: 0 18px;
      }

    }

  </style>

</head>


<body>


  <!-- 상단 -->

  <header>

    <div class="header-inner">

      <div class="logo">
        HDP 아카데미
      </div>

      <a
        class="hub-link"
        href="../"
      >
        Learning Hub
      </a>

    </div>

  </header>



  <main>


    <!-- 교육 제목 -->

    <div class="title-area">

      <div class="category">
        Learning Hub
      </div>

      <h1>
        테스트중입니다
      </h1>

    </div>



    <!-- 카드뉴스 -->

    <div class="carousel">


      <div
        class="slides"
        id="slides"
      >


        <!-- 1페이지 -->

        <div class="slide">

          <img
            src="1.png"
            alt="테스트중입니다 1페이지"
          >

        </div>


        <!-- 2페이지 -->

        <div class="slide">

          <img
            src="2.png"
            alt="테스트중입니다 2페이지"
          >

        </div>


        <!-- 3페이지 -->

        <div class="slide">

          <img
            src="3.png"
            alt="테스트중입니다 3페이지"
          >

        </div>


        <!-- 4페이지 -->

        <div class="slide">

          <img
            src="4.png"
            alt="테스트중입니다 4페이지"
          >

        </div>


        <!-- 5페이지 -->

        <div class="slide">

          <img
            src="5.png"
            alt="테스트중입니다 5페이지"
          >

        </div>


      </div>



      <!-- 이전 버튼 -->

      <button
        class="arrow prev"
        type="button"
        aria-label="이전 페이지"
        onclick="previousSlide()"
      >
        ‹
      </button>



      <!-- 다음 버튼 -->

      <button
        class="arrow next"
        type="button"
        aria-label="다음 페이지"
        onclick="nextSlide()"
      >
        ›
      </button>


    </div>



    <!-- 페이지 표시 -->

    <div class="navigation">

      <div
        class="dots"
        id="dots"
      ></div>

      <div
        class="counter"
        id="counter"
      ></div>

    </div>



    <!-- 메인으로 돌아가기 -->

    <div class="back-area">

      <a
        class="back-button"
        href="../"
      >
        ← Learning Hub로 돌아가기
      </a>

    </div>


  </main>



  <script>

    let currentSlide = 0;


    /* 이미지 개수를 자동으로 계산 */

    const slideElements =
      document.querySelectorAll(".slide");

    const totalSlides =
      slideElements.length;


    const slides =
      document.getElementById("slides");

    const dotsContainer =
      document.getElementById("dots");

    const counter =
      document.getElementById("counter");



    /* 페이지 점 자동 생성 */

    for (
      let i = 0;
      i < totalSlides;
      i++
    ) {

      const dot =
        document.createElement("div");

      dot.classList.add("dot");


      dot.addEventListener(
        "click",
        function() {

          currentSlide = i;

          updateCarousel();

        }
      );


      dotsContainer.appendChild(dot);

    }



    /* 화면 업데이트 */

    function updateCarousel() {

      slides.style.transform =
        `translateX(-${currentSlide * 100}%)`;


      counter.textContent =
        `${currentSlide + 1} / ${totalSlides}`;


      document
        .querySelectorAll(".dot")
        .forEach(
          function(dot, index) {

            dot.classList.toggle(
              "active",
              index === currentSlide
            );

          }
        );

    }



    /* 다음 페이지 */

    function nextSlide() {

      currentSlide++;

      if (
        currentSlide >= totalSlides
      ) {

        currentSlide = 0;

      }

      updateCarousel();

    }



    /* 이전 페이지 */

    function previousSlide() {

      currentSlide--;

      if (
        currentSlide < 0
      ) {

        currentSlide =
          totalSlides - 1;

      }

      updateCarousel();

    }



    /* PC 키보드 방향키 */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "ArrowRight"
        ) {

          nextSlide();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          previousSlide();

        }

      }
    );



    /* 모바일 스와이프 */

    let touchStartX = 0;
    let touchEndX = 0;


    slides.addEventListener(
      "touchstart",
      function(event) {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      {
        passive: true
      }
    );


    slides.addEventListener(
      "touchend",
      function(event) {

        touchEndX =
          event.changedTouches[0].screenX;

        handleSwipe();

      },
      {
        passive: true
      }
    );


    function handleSwipe() {

      const distance =
        touchStartX - touchEndX;


      if (
        Math.abs(distance) < 50
      ) {

        return;

      }


      if (
        distance > 0
      ) {

        nextSlide();

      }

      else {

        previousSlide();

      }

    }



    /* 최초 실행 */

    updateCarousel();

  </script>


</body>

</html>
