<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HDP 아카데미</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f7f7f8;
  color: #191919;
}

/* 상단 */
header {
  background: white;
  border-bottom: 1px solid #e8e8e8;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  padding: 22px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: 700;
}

nav {
  font-size: 15px;
  font-weight: 600;
}

/* 메인 */
main {
  max-width: 1100px;
  margin: auto;
  padding: 60px 24px;
}

.hero {
  margin-bottom: 45px;
}

.hero h1 {
  margin: 0 0 12px;
  font-size: 38px;
}

.hero p {
  margin: 0;
  color: #666;
  font-size: 17px;
}

/* 게시물 영역 */
.section-title {
  font-size: 22px;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

/* 게시물 카드 */
.card {
  display: block;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  border: 1px solid #ededed;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

.thumbnail {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
}

.content {
  padding: 20px;
}

.category {
  font-size: 13px;
  color: #777;
  margin-bottom: 9px;
}

.title {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 10px;
}

.description {
  color: #666;
  font-size: 14px;
  line-height: 1.6;
}

.date {
  margin-top: 18px;
  color: #999;
  font-size: 12px;
}

/* 모바일 */
@media(max-width: 800px) {

  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media(max-width: 550px) {

  .header-inner {
    padding: 18px;
  }

  main {
    padding: 40px 18px;
  }

  .hero h1 {
    font-size: 30px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">HDP 아카데미</div>
    <nav>Learning Hub</nav>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Learning Hub</h1>
    <p>임직원을 위한 교육 콘텐츠를 확인해보세요.</p>
  </section>

  <h2 class="section-title">교육 콘텐츠</h2>

  <div class="grid">

    <!-- 첫 번째 게시물 -->
    <a class="card" href="post1/">

      <img
        class="thumbnail"
        src="1.png"
        alt="교육 콘텐츠 썸네일"
      >

      <div class="content">

        <div class="category">
          Learning Hub
        </div>

        <div class="title">
          교육 카드뉴스
        </div>

        <div class="description">
          카드뉴스를 좌우로 넘기며 교육 내용을 확인해보세요.
        </div>

        <div class="date">
          2026.09
        </div>

      </div>

    </a>

  </div>

</main>

</body>
</html>
