<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>교육 카드뉴스 | HDP 아카데미</title>

  <!-- Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f6f7f9;
      color: #191919;
    }

    /* 상단 */

    header {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e8e8e8;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
    }

    .hub-link {
      color: #555;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .hub-link:hover {
      color: #000;
    }

    /* 전체 콘텐츠 */

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 45px 20px 70px;
    }

    /* 제목 */

    .title-area {
      margin-bottom: 24px;
    }

    .category {
      color: #888;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 9px;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .description {
      margin: 0;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 캐러셀 */

    .carousel {
      position: relative;
      width: 100%;
      overflow: hidden;

      background: #ffffff;
      border-radius: 18px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
    }

    .slides {
      display: flex;
      width: 100%;
      transition: transform 0.35s ease;
      touch-action: pan-y;
    }

    .slide {
      min-width: 100%;
      width: 100%;
    }

    .slide img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 좌우 버튼 */

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 46px;
      height: 46px;

      border: 0;
      border-radius: 50%;

      background: rgba(0,0,0,0.45);
      color: #ffffff;

      font-family: "Noto Sans KR", sans-serif;
      font-size: 28px;

      cursor: pointer;
      z-index: 10;
    }

    .arrow:hover {
      background: rgba(0,0,0,0.65);
    }

    .prev {
      left: 12px;
    }

    .next {
      right: 12px;
    }

    /* 페이지 표시 */

    .navigation {
      text-align: center;
      padding-top: 18px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cccccc;
      cursor: pointer;
      transition: 0.2s;
    }

    .dot.active {
      width: 22px;
      border-radius: 10px;
      background: #222222;
    }

    .counter {
      margin-top: 9px;
      color: #888;
      font-size: 13px;
    }

    /* 메인으로 돌아가기 */

    .back-area {
      margin-top: 30px;
      text-align: center;
    }

    .back-button {
      display: inline-block;

      padding: 11px 18px;

      border: 1px solid #dddddd;
      border-radius: 9px;

      background: #ffffff;

      color: #333333;
      text-decoration: none;

      font-size: 14px;
      font-weight: 500;
    }

    .back-button:hover {
      background: #f2f2f2;
    }

    /* 모바일 */

    @media (max-width: 600px) {

      .header-inner {
        padding: 16px 18px;
      }

      .logo {
        font-size: 17px;
      }

      main {
        padding: 28px 0 50px;
      }

      .title-area {
        padding: 0 18px;
      }

      h1 {
        font-size: 23px;
      }

      .carousel {
        border-radius: 0;
        box-shadow: none;
      }

      .arrow {
        width: 40px;
        height: 40px;
        font-size: 24px;
      }

      .prev {
        left: 8px;
      }

      .next {
        right: 8px;
      }

      .back-area {
        padding: 0 18px;
      }
    }
  </style>
</head>

<body>

  <!-- 상단 -->

  <header>
    <div class="header-inner">

      <div class="logo">
        HDP 아카데미
      </div>

      <a
        class="hub-link"
        href="https://y-u-b-i-n.github.io/edu/"
      >
        Learning Hub
      </a>

    </div>
  </header>


  <main>

    <!-- 제목 -->

    <div class="title-area">

      <div class="category">
        Learning Hub
      </div>

      <h1>
        교육 카드뉴스
      </h1>

      <p class="description">
        좌우로 넘기며 교육 내용을 확인해보세요.
      </p>

    </div>


    <!-- 카드뉴스 -->

    <div class="carousel">

      <div class="slides" id="slides">

        <div class="slide">
          <img
            src="https://y-u-b-i-n.github.io/edu/1.png"
            alt="교육 카드뉴스 1"
          >
        </div>

        <div class="slide">
          <img
            src="https://y-u-b-i-n.github.io/edu/2.png"
            alt="교육 카드뉴스 2"
          >
        </div>

        <div class="slide">
          <img
            src="https://y-u-b-i-n.github.io/edu/3.png"
            alt="교육 카드뉴스 3"
          >
        </div>

        <div class="slide">
          <img
            src="https://y-u-b-i-n.github.io/edu/4.png"
            alt="교육 카드뉴스 4"
          >
        </div>

        <div class="slide">
          <img
            src="https://y-u-b-i-n.github.io/edu/5.png"
            alt="교육 카드뉴스 5"
          >
        </div>

      </div>


      <button
        class="arrow prev"
        type="button"
        aria-label="이전 카드"
        onclick="previousSlide()"
      >
        ‹
      </button>

      <button
        class="arrow next"
        type="button"
        aria-label="다음 카드"
        onclick="nextSlide()"
      >
        ›
      </button>

    </div>


    <!-- 현재 페이지 -->

    <div class="navigation">

      <div
        class="dots"
        id="dots"
      ></div>

      <div
        class="counter"
        id="counter"
      >
        1 / 5
      </div>

    </div>


    <!-- 메인 이동 -->

    <div class="back-area">

      <a
        class="back-button"
        href="https://y-u-b-i-n.github.io/edu/"
      >
        ← Learning Hub로 돌아가기
      </a>

    </div>

  </main>


  <script>

    let currentSlide = 0;

    const totalSlides = 5;

    const slides =
      document.getElementById("slides");

    const dotsContainer =
      document.getElementById("dots");

    const counter =
      document.getElementById("counter");


    /* 페이지 점 만들기 */

    for (let i = 0; i < totalSlides; i++) {

      const dot =
        document.createElement("div");

      dot.classList.add("dot");

      dot.addEventListener("click", function () {

        currentSlide = i;

        updateCarousel();

      });

      dotsContainer.appendChild(dot);

    }


    /* 캐러셀 업데이트 */

    function updateCarousel() {

      slides.style.transform =
        `translateX(-${currentSlide * 100}%)`;

      counter.textContent =
        `${currentSlide + 1} / ${totalSlides}`;

      document
        .querySelectorAll(".dot")
        .forEach(function(dot, index) {

          dot.classList.toggle(
            "active",
            index === currentSlide
          );

        });

    }


    /* 다음 */

    function nextSlide() {

      currentSlide++;

      if (currentSlide >= totalSlides) {
        currentSlide = 0;
      }

      updateCarousel();

    }


    /* 이전 */

    function previousSlide() {

      currentSlide--;

      if (currentSlide < 0) {
        currentSlide = totalSlides - 1;
      }

      updateCarousel();

    }


    /* PC 키보드 */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "ArrowRight") {
          nextSlide();
        }

        if (event.key === "ArrowLeft") {
          previousSlide();
        }

      }
    );


    /* 모바일 스와이프 */

    let touchStartX = 0;
    let touchEndX = 0;


    slides.addEventListener(
      "touchstart",
      function(event) {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      { passive: true }
    );


    slides.addEventListener(
      "touchend",
      function(event) {

        touchEndX =
          event.changedTouches[0].screenX;

        handleSwipe();

      },
      { passive: true }
    );


    function handleSwipe() {

      const distance =
        touchStartX - touchEndX;

      if (Math.abs(distance) < 50) {
        return;
      }

      if (distance > 0) {

        nextSlide();

      } else {

        previousSlide();

      }

    }


    /* 최초 실행 */

    updateCarousel();

  </script>

</body>
</html>
