<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HDP 아카데미 | Learning Hub</title>


  <!-- Noto Sans KR -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        "Noto Sans KR",
        sans-serif;

      background: #f7f8fa;

      color: #191919;

    }



    /* =====================
       상단
       ===================== */

    header {

      width: 100%;

      background: #ffffff;

      border-bottom:
        1px solid #e9e9e9;

    }


    .header-inner {

      max-width: 1100px;

      margin: 0 auto;

      padding: 22px 20px;

      text-align: center;

    }


    .logo {

      font-size: 22px;

      font-weight: 700;

      letter-spacing: -0.5px;

    }



    /* =====================
       메인
       ===================== */

    main {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

      padding:
        60px 20px
        100px;

    }



    /* =====================
       Learning Hub
       ===================== */

    .hero {

      text-align: center;

      margin-bottom: 45px;

    }


    .hero h1 {

      margin: 0;

      font-size: 38px;

      font-weight: 700;

      letter-spacing: -1px;

    }



    /* =====================
       게시물 영역
       ===================== */

    .posts {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      align-items: flex-start;

      gap: 28px;

    }



    /* =====================
       게시물 썸네일
       ===================== */

    .post {

      display: block;

      width: 240px;

      text-decoration: none;

      border-radius: 14px;

      overflow: hidden;

      background: #ffffff;

      border:
        1px solid #e7e7e7;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    }


    .post:hover {

      transform:
        translateY(-5px);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,0.10);

    }



    /* 썸네일 이미지 */

    .thumbnail {

      display: block;

      width: 100%;

      height: auto;

    }



    /* =====================
       모바일
       ===================== */

    @media
    (max-width: 600px) {


      .header-inner {

        padding:
          18px 15px;

      }


      .logo {

        font-size: 19px;

      }


      main {

        padding:
          42px 15px
          70px;

      }


      .hero {

        margin-bottom: 30px;

      }


      .hero h1 {

        font-size: 30px;

      }


      .posts {

        gap: 20px;

      }


      .post {

        width: 210px;

        max-width: 75vw;

      }

    }

  </style>

</head>



<body>


  <!-- 상단 -->

  <header>

    <div class="header-inner">

      <div class="logo">

        HDP 아카데미

      </div>

    </div>

  </header>



  <!-- 메인 -->

  <main>


    <section class="hero">

      <h1>

        Learning Hub

      </h1>

    </section>



    <!-- 게시물 목록 -->

    <section class="posts">


      <!-- 게시물 1 -->

      <a
        class="post"
        href="https://y-u-b-i-n.github.io/edu/post1/"
        aria-label="교육 카드뉴스 보기"
      >

        <img
          class="thumbnail"
          src="https://y-u-b-i-n.github.io/edu/1.png"
          alt="교육 카드뉴스 썸네일"
        >

      </a>


    </section>


  </main>


</body>

</html>
