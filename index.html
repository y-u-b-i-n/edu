<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HDP 아카데미 | Learning Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f7f8fa;
      color: #191919;
    }

    /* HEADER */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e8e8e8;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav {
      font-size: 15px;
      font-weight: 600;
    }

    /* MAIN */

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 70px 24px 100px;
    }

    /* HERO */

    .hero {
      margin-bottom: 55px;
    }

    .hero-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 14px;
    }

    .hero h1 {
      margin: 0 0 15px;
      font-size: 42px;
      letter-spacing: -1.5px;
    }

    .hero p {
      margin: 0;
      color: #666;
      font-size: 17px;
      line-height: 1.7;
    }

    /* SECTION */

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .section-title {
      margin: 0;
      font-size: 24px;
    }

    .count {
      color: #999;
      font-size: 14px;
    }

    /* GRID */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    /* CARD */

    .card {
      display: block;
      background: #ffffff;
      border: 1px solid #ececec;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    }

    .thumbnail-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #eeeeee;
    }

    .thumbnail {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .thumbnail {
      transform: scale(1.03);
    }

    .card-content {
      padding: 22px;
    }

    .category {
      font-size: 13px;
      font-weight: 600;
      color: #777;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    .card-bottom {
      margin-top: 22px;
      padding-top: 17px;
      border-top: 1px solid #f0f0f0;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date {
      color: #999;
      font-size: 12px;
    }

    .view {
      font-size: 13px;
      font-weight: 700;
    }

    /* FOOTER */

    footer {
      background: #ffffff;
      border-top: 1px solid #e7e7e7;
    }

    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px;
      color: #999;
      font-size: 12px;
    }

    /* TABLET */

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 36px;
      }
    }

    /* MOBILE */

    @media (max-width: 580px) {

      .header-inner {
        padding: 17px 18px;
      }

      .logo {
        font-size: 18px;
      }

      .nav {
        font-size: 13px;
      }

      main {
        padding: 45px 18px 70px;
      }

      .hero {
        margin-bottom: 42px;
      }

      .hero h1 {
        font-size: 31px;
      }

      .hero p {
        font-size: 15px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      HDP 아카데미
    </div>

    <div class="nav">
      Learning Hub
    </div>

  </div>
</header>


<main>

  <!-- 소개 -->

  <section class="hero">

    <div class="hero-label">
      HDP ACADEMY
    </div>

    <h1>
      Learning Hub
    </h1>

    <p>
      임직원을 위한 교육 콘텐츠를<br>
      쉽고 빠르게 확인해보세요.
    </p>

  </section>


  <!-- 교육 콘텐츠 -->

  <section>

    <div class="section-header">

      <h2 class="section-title">
        교육 콘텐츠
      </h2>

      <div class="count">
        1개의 콘텐츠
      </div>

    </div>


    <div class="grid">


      <!-- 게시물 1 -->

      <a
        class="card"
        href="https://y-u-b-i-n.github.io/edu/post1/"
      >

        <div class="thumbnail-wrap">

          <img
            class="thumbnail"
            src="https://y-u-b-i-n.github.io/edu/1.png"
            alt="교육 카드뉴스"
          >

        </div>


        <div class="card-content">

          <div class="category">
            Learning Hub
          </div>

          <div class="card-title">
            교육 카드뉴스
          </div>

          <div class="description">
            카드뉴스를 좌우로 넘기며
            교육 내용을 확인해보세요.
          </div>


          <div class="card-bottom">

            <span class="date">
              2026.09
            </span>

            <span class="view">
              자세히 보기 →
            </span>

          </div>

        </div>

      </a>


    </div>

  </section>

</main>


<footer>

  <div class="footer-inner">
    HDP 아카데미 · Learning Hub
  </div>

</footer>


</body>
</html>
